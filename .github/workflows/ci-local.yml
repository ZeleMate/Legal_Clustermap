name: Local CI

# This repo's own CI jobs. The template wrote this file once and never updates it.
# ci.yml calls it on every PR and push, and the merge gate (ci-ok) waits for it.
# Moved here from the old ci.yml when the repo adopted the template.
#
# Rules: no job may need a secret (Dependabot PRs get none), every action is pinned
# to a full commit SHA, and each job asks for read access only.
on:
  workflow_call:

permissions: {}

jobs:
  build-and-test:
    name: docker build and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t legal-clustermap .
      - name: Run the tests in the container
        run: docker run --rm legal-clustermap
