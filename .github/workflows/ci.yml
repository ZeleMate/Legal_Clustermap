name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Kód klónozása
      uses: actions/checkout@v3

    - name: Docker építése
      run: docker build -t bhgy-cluster .

    - name: Program futtatása konténerben
      run: |
        docker run --rm bhgy-cluster